name: Comic Editor CI
on:
  push:
    branches: [feature/comic-editor]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: TypeScript and bundle build
        run: npm run build

      - name: Unit tests
        run: npm test
